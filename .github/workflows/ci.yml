name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep this namespace stable; the original group contains orphaned GitHub runs.
  group: dartflow-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DARTFLOW_DATA_MODE: local
      DARTFLOW_APP_ORIGIN: http://localhost:3000
      DARTFLOW_RELEASE_SHA: ${{ github.sha }}
      DARTFLOW_PG_BIN: /usr/lib/postgresql/16/bin
      # Public synthetic fixture key for the isolated local database; never a hosted secret.
      DARTFLOW_PLAYER_PIN_PEPPERS: ci-v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DARTFLOW_PLAYER_PIN_PEPPER_VERSION: ci-v1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install repository-pinned npm and locked dependencies
        run: |
          npm install --global npm@11.16.0
          test "$(npm --version)" = "$(cat .npm-version)"
          npm ci
      - name: Verify preinstalled PostgreSQL 16
        run: |
          for executable in initdb pg_ctl postgres; do
            test -x "$DARTFLOW_PG_BIN/$executable"
          done
          "$DARTFLOW_PG_BIN/postgres" --version |
            grep -Eq '^postgres \(PostgreSQL\) 16\.'
      - name: Start isolated local test database
        run: |
          npm run db:start
          npm run db:migrate
          npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:prototype
      - name: Verify Play release transitions without credentials
        run: python3 -B android/oche-live/ci/test_play_release.py
      - run: npm run test:deploy
      - name: Verify privileged bootstrap contracts without host mutations
        run: |
          python3 -B tests/runner-installer-test.py
          python3 -B tests/blocked-cleanup-probe-test.py
          python3 -B tests/runtime-boundaries-test.py
          python3 -B tests/host-upgrade-test.py
          python3 -B tests/turn-peer-guard-test.py
          python3 -B tests/turn-tls-test.py
      - name: Verify Auth redirect probe without network requests
        run: python3 -B tests/auth-redirect-live-test.py
      - run: npm run build
      - name: Install pinned Chromium
        run: |
          test -z "${PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS:-}"
          test -z "${DARTFLOW_BROWSER_PATH:-}"
          npx --no-install playwright install chromium
      - name: Verify scoped Feed and chat regression
        run: npx --no-install playwright test tests/e2e/community-v17.spec.ts
      - run: npm run test:e2e
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
      - name: Package standalone candidate
        run: node ops/package-release.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
      - name: Stop local test database
        if: always()
        run: npm run db:stop
